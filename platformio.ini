; ArtSwitch - Art-Net controlled relays on a WT32-ETH01

; First flash / recovery over USB serial: pio run -e wt32-eth01 -t upload --upload-port COM5
[env:wt32-eth01]
platform = espressif32
board = wt32-eth01
framework = arduino
monitor_speed = 115200
upload_speed = 460800
lib_deps =
    esp32async/AsyncTCP@^3.3.2
    esp32async/ESPAsyncWebServer@^3.7.0

; Firmware update over Ethernet: pio run -e ota -t upload --upload-port <name>.local (or IP)
[env:ota]
extends = env:wt32-eth01
upload_protocol = espota
upload_port = artswitch.local
